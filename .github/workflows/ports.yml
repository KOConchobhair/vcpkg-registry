name: ports

# Builds tests/vcpkg.json - the consumer manifest - on every triplet this registry
# ships a triplet file for, each on a native runner. All four runner images are
# free for public repositories.
#
# consumer mode resolves through versions/ and the manifest's own
# vcpkg-configuration rather than --overlay-ports, so this is the exact path a
# consumer of this registry takes. Resolution happens before any compiling, so a
# broken feature graph or an unrecorded version still fails within a minute or
# two; there is no need for a separate resolve-only job.

on:
  push:
    branches: [trunk]
  pull_request:
  workflow_dispatch:

# Declaring any permission replaces the whole default set, so contents: read has
# to be spelled out or checkout loses its token. packages is for the NuGet binary
# cache; id-token and attestations are what actions/attest-build-provenance signs
# with. Attestations are free here because the repository is public - on Free, Pro
# and Team they are public-repository-only.
permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  # The upstream commit the ports were vendored from, and the baseline
  # tests/vcpkg.json pins. Ports outside this registry come from here.
  VCPKG_BASELINE: 3c5d90a305ff00ca841f085a74a7ce74ee777dee

jobs:
  build:
    name: ${{ matrix.triplet }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          # nuget: whether this leg also pushes to the GitHub Packages binary
          # cache. Off on the two macOS legs for now: nuget.exe needs mono there
          # and the runner image is not documented to ship it, so those wait until
          # the linux and windows legs have proved the feed works.
          - { runner: ubuntu-22.04, triplet: x64-linux, os: linux, nuget: true }
          - { runner: ubuntu-22.04-arm, triplet: arm64-linux, os: linux, nuget: true }
          - { runner: macos-14, triplet: arm64-osx, os: macos }
          - { runner: windows-2022, triplet: x64-windows, os: windows, nuget: true }
          # Cross targets: host_triplet is the machine doing the building, since
          # android and ios binaries cannot run on the runner and vcpkg needs host
          # tools (moc, and the host qtbase behind it) it can execute.
          # ANDROID_NDK_HOME comes from the runner image itself; no step sets it.
          - { runner: ubuntu-22.04, triplet: arm64-android, os: linux, host_triplet: x64-linux, nuget: true }
          - { runner: macos-14, triplet: arm64-ios, os: macos, host_triplet: arm64-osx }
    defaults:
      run:
        # Git Bash on Windows, so tests/run.sh is the single implementation
        # everywhere. It converts the Actions-supplied paths with cygpath.
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          # consumer mode clones this repo as a git registry at github.sha.
          fetch-depth: 0

      - name: Reclaim disk space
        if: matrix.os == 'linux'
        # qtbase and opencv4 buildtrees are large. The preinstalled toolchains are
        # not used here, and dropping them roughly doubles the free space.
        #
        # /usr/local/lib/android is exempt on the android leg: that is where the NDK
        # lives, and deleting it is why that leg reported "no installed NDK" while
        # ANDROID_NDK_LATEST_HOME still pointed into the directory we had removed.
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
                      "$AGENT_TOOLSDIRECTORY" || true
          case "${{ matrix.triplet }}" in
            *android*) echo "keeping /usr/local/lib/android (NDK)" ;;
            *)         sudo rm -rf /usr/local/lib/android || true ;;
          esac
          df -h /

      - name: Install prerequisites (Linux)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update -qq
          grep -v '^[[:space:]]*#' tests/apt-packages.txt | grep -v '^[[:space:]]*$' \
            | xargs sudo apt-get install -y -qq --no-install-recommends

      - name: Install prerequisites (macOS)
        if: matrix.os == 'macos'
        # autoconf-archive is what libb2 needs; nasm is for openh264/ffmpeg asm.
        # No cmake or ninja - vcpkg fetches its own, same as everywhere else.
        run: brew install autoconf autoconf-archive automake libtool nasm pkgconf

      # Windows needs nothing installed: windows-2022 ships MSVC, and vcpkg
      # acquires nasm and perl itself when a port asks for them.

      # Keyed on everything that affects an ABI hash, so a port or triplet edit
      # invalidates cleanly while restore-keys still seeds from the last run. The
      # restored directory holds one zip per package, each named by its own ABI
      # hash, so even a stale snapshot yields a hit for every package whose ABI has
      # not moved - which is what makes this behave like a per-package cache on the
      # read side.
      #
      # Split into restore + save deliberately. The combined action only writes the
      # cache when the job succeeds, so a leg that fails late - as the mobile ones
      # have been doing after ten minutes of compiling - threw away everything it
      # built and started from nothing next run.
      - name: Restore vcpkg caches
        id: vcpkg-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ runner.temp }}/cache
            ${{ runner.temp }}/downloads
          key: vcpkg-${{ matrix.triplet }}-${{ env.VCPKG_BASELINE }}-${{ hashFiles('ports/**', 'triplets/**', 'tests/vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ matrix.triplet }}-${{ env.VCPKG_BASELINE }}-
            vcpkg-${{ matrix.triplet }}-

      # Runs tests/verify.sh on success; that is where the real assertions live.
      - name: Build and verify
        run: ./tests/run.sh ${{ matrix.triplet }} consumer
        env:
          REGISTRY: ${{ github.workspace }}
          WORK: ${{ runner.temp }}/work
          VCPKG_DOWNLOADS: ${{ runner.temp }}/downloads
          VCPKG_DEFAULT_BINARY_CACHE: ${{ runner.temp }}/cache
          REGISTRY_HEAD: ${{ github.sha }}
          # Empty for the four native triplets, so run.sh falls back to the target.
          HOST_TRIPLET: ${{ matrix.host_triplet }}
          # GitHub Packages NuGet feeds are scoped to the owner, not to a
          # repository - there is no per-repo feed URL. Packages therefore land
          # under this account and link to whichever repository pushed them.
          #
          # Only on push: a pull_request from a fork gets a read-only token, and
          # asking for readwrite there would fail the leg on something that is not
          # the thing under test. Empty on the macOS legs (see matrix), and an
          # empty feed switches the block in run.sh off entirely.
          VCPKG_NUGET_FEED: ${{ (matrix.nuget && github.event_name == 'push') && format('https://nuget.pkg.github.com/{0}/index.json', github.repository_owner) || '' }}
          VCPKG_NUGET_TOKEN: ${{ (matrix.nuget && github.event_name == 'push') && secrets.GITHUB_TOKEN || '' }}
          VCPKG_NUGET_USER: ${{ github.repository_owner }}

      # Runs even when the build failed, so a partial leg keeps whatever it managed
      # to build. Skipped on an exact key hit, where re-uploading would be pure cost.
      - name: Save vcpkg caches
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ runner.temp }}/cache
            ${{ runner.temp }}/downloads
          key: vcpkg-${{ matrix.triplet }}-${{ env.VCPKG_BASELINE }}-${{ hashFiles('ports/**', 'triplets/**', 'tests/vcpkg.json') }}

      - name: Installed tree
        if: always()
        run: |
          d="${RUNNER_TEMP}/work/installed/${{ matrix.triplet }}"
          ls -la "$d/lib" 2>/dev/null || true
          ls -la "$d/bin" 2>/dev/null || true
          # Every library outside lib/ and bin/. Listing only those two is what
          # left the Android opencv location and the static iOS TLS plugin name
          # invisible in the logs, so a verify.sh miss cost a CI round-trip to
          # diagnose instead of being answerable from the run that failed.
          find "$d" \( -name '*.a' -o -name '*.so' -o -name '*.dylib' -o -name '*.dll' \) \
            -not -path "$d/lib/*" -not -path "$d/bin/*" 2>/dev/null | sort || true

      # One distributable per leg, so provenance has a concrete subject - and so
      # there is something a teammate can download without the personal access
      # token GitHub Packages NuGet requires even for a public feed.
      #
      # tar -czf rather than zstd: bsdtar on the macOS and Windows runners is not
      # guaranteed to have --zstd, and this is not the place to find out.
      - name: Package installed tree
        id: pack
        if: success() && github.event_name == 'push'
        run: |
          t="${RUNNER_TEMP}"
          command -v cygpath >/dev/null 2>&1 && t="$(cygpath -u "$t")"
          d="$t/work/installed/${{ matrix.triplet }}"
          out="$t/vcpkg-${{ matrix.triplet }}-${GITHUB_SHA:0:7}.tar.gz"
          tar -czf "$out" -C "$(dirname "$d")" "$(basename "$d")"
          ls -lh "$out"
          echo "path=$out" >> "$GITHUB_OUTPUT"

      - name: Upload installed tree
        if: success() && github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: vcpkg-${{ matrix.triplet }}
          path: ${{ steps.pack.outputs.path }}
          retention-days: 30

      # Signs a SLSA provenance statement binding that tarball to this workflow,
      # commit and runner. Verify a download with:
      #   gh attestation verify vcpkg-<triplet>-<sha>.tar.gz -R <owner>/vcpkg-registry
      - name: Attest build provenance
        if: success() && github.event_name == 'push'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ steps.pack.outputs.path }}

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: logs-${{ matrix.triplet }}
          path: ${{ runner.temp }}/work/buildtrees/**/*.log
          retention-days: 7
          if-no-files-found: ignore
